<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Súper 4 - Copa Mikasa Vóleibol UC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0055a4; /* Azul UC / Mikasa */
            --secondary-color: #009de0; /* Celeste claro */
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --positive: #10b981;
            --negative: #ef4444;
            --neutral: #94a3b8;
            --gold: #f59e0b; /* Color para destacar finales */
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main); 
            margin: 0; 
            padding: 40px 20px; 
        }

        .header-torneo {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 { 
            color: var(--primary-color); 
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            color: var(--secondary-color);
            font-weight: 600;
            font-size: 1.1rem;
            margin-top: 5px;
        }

        .contenedor { 
            display: flex; 
            flex-direction: column; 
            gap: 40px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .categoria { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); 
            border-top: 5px solid var(--secondary-color);
        }

        h2 {
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tabla-container { 
            overflow-x: auto; 
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 14px; 
            white-space: nowrap;
        }

        th, td { 
            padding: 14px 16px; 
            text-align: center; 
        }

        th { 
            background-color: #f8fafc; 
            color: var(--text-muted); 
            font-weight: 600; 
            text-transform: uppercase; 
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e2e8f0;
        }

        tbody tr {
            border-bottom: 1px solid #f1f5f9;
            transition: background-color 0.2s ease;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        .col-equipo { 
            text-align: left; 
            font-weight: 600; 
            color: var(--primary-color); 
            font-size: 15px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: white;
            min-width: 24px;
        }
        .badge.positivo { background-color: var(--positive); }
        .badge.negativo { background-color: var(--negative); }
        .badge.neutro { background-color: var(--neutral); color: white; }

        .historial-partidos { 
            margin-top: 30px; 
        }

        .historial-partidos h3 {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }

        .lista-partidos { 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .partido-card { 
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.2s;
        }

        .partido-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .partido-card.playoff {
            border: 1px solid var(--gold);
            background: #fffbeb; /* Fondo amarillento muy suave */
        }
        
        .playoff-etiqueta {
            color: var(--gold);
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .partido-fecha { 
            font-size: 0.8rem; 
            color: var(--text-muted); 
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .partido-resultado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .eq-nombre { flex: 1; font-size: 0.95rem; }
        .eq-nombre.right { text-align: right; }
        
        .marcador-sets {
            background: var(--primary-color);
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
            margin: 0 10px;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }
        
        .marcador-pendiente {
            background: var(--neutral);
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
            margin: 0 10px;
            font-size: 1rem;
        }

        .partido-detalles {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.03);
            padding: 4px;
            border-radius: 4px;
            margin-top: 5px;
        }

        td:nth-child(2) {
            font-weight: 800;
            color: var(--primary-color);
            font-size: 1.1rem;
            background-color: #f8fafc;
        }

        /* Título para separar la fase final */
        .separador-fase {
            grid-column: 1 / -1;
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 1.1rem;
            color: var(--primary-color);
            font-weight: 800;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            body { padding: 20px 10px; }
            .categoria { padding: 15px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="header-torneo">
        <h1>Súper 4 Vóleibol UC</h1>
        <div class="subtitle">Copa Mikasa U18</div>
    </div>

    <div class="contenedor">
        <div class="categoria" id="seccion-masculino">
            <h2>🏆 Varones - Cancha 2</h2>
            <div class="tabla-container">
                <table id="tabla-masculino">
                    <thead>
                        <tr>
                            <th class="col-equipo">Equipo</th>
                            <th>PJE</th><th>PTDOS</th><th>GNDOS</th>
                            <th>SET+</th><th>SET-</th><th>DIFSET</th>
                            <th>PTOS+</th><th>PTOS-</th><th>SETAVG</th><th>PTOSAVG</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="historial-partidos">
                <h3>Fixture y Resultados</h3>
                <div class="lista-partidos" id="historial-masculino"></div>
            </div>
        </div>

        <div class="categoria" id="seccion-femenino">
            <h2>🏆 Damas - Cancha 1</h2>
            <div class="tabla-container">
                <table id="tabla-femenino">
                    <thead>
                        <tr>
                            <th class="col-equipo">Equipo</th>
                            <th>PJE</th><th>PTDOS</th><th>GNDOS</th>
                            <th>SET+</th><th>SET-</th><th>DIFSET</th>
                            <th>PTOS+</th><th>PTOS-</th><th>SETAVG</th><th>PTOSAVG</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="historial-partidos">
                <h3>Fixture y Resultados</h3>
                <div class="lista-partidos" id="historial-femenino"></div>
            </div>
        </div>
    </div>

    <script>
        // 1. EQUIPOS DE LA COPA MIKASA
        const equiposMasculino = ["Universidad Católica", "Excelsior", "Stadio Italiano", "Zada"];
        const equiposFemenino = ["Universidad Católica", "Colo Colo", "Boston College", "Stadio Italiano"];

        // 2. BASE DE DATOS DE PARTIDOS (FIXTURE)
        const partidosJugados = {
            masculino: [
                // FASE REGULAR (Suman puntos)
                { fecha: "Sáb 16 Mayo - 15:00 hrs", equipoA: "Excelsior", equipoB: "Stadio Italiano", jugado: false },
                { fecha: "Sáb 16 Mayo - 16:15 hrs", equipoA: "Universidad Católica", equipoB: "Zada", jugado: false },
                { fecha: "Sáb 16 Mayo - 17:30 hrs", equipoA: "Universidad Católica", equipoB: "Stadio Italiano", jugado: false },
                { fecha: "Sáb 16 Mayo - 18:45 hrs", equipoA: "Excelsior", equipoB: "Zada", jugado: false },
                { fecha: "Dom 17 Mayo - 14:30 hrs", equipoA: "Universidad Católica", equipoB: "Excelsior", jugado: false },
                { fecha: "Dom 17 Mayo - 15:45 hrs", equipoA: "Zada", equipoB: "Stadio Italiano", jugado: false },
                
                // FASE FINAL (No suman puntos, tienen la etiqueta esPlayoff: true)
                { fecha: "Dom 17 Mayo - 17:00 hrs", equipoA: "3° Lugar Varones", equipoB: "4° Lugar Varones", jugado: false, esPlayoff: true, etiqueta: "Tercer Lugar" },
                { fecha: "Dom 17 Mayo - 18:30 hrs", equipoA: "1° Lugar Varones", equipoB: "2° Lugar Varones", jugado: false, esPlayoff: true, etiqueta: "GRAN FINAL" }
            ],
            femenino: [
                // FASE REGULAR (Suman puntos)
                { fecha: "Sáb 16 Mayo - 15:00 hrs", equipoA: "Colo Colo", equipoB: "Stadio Italiano", jugado: false },
                { fecha: "Sáb 16 Mayo - 16:15 hrs", equipoA: "Universidad Católica", equipoB: "Boston College", jugado: false },
                { fecha: "Sáb 16 Mayo - 17:30 hrs", equipoA: "Universidad Católica", equipoB: "Stadio Italiano", jugado: false },
                { fecha: "Sáb 16 Mayo - 18:45 hrs", equipoA: "Colo Colo", equipoB: "Boston College", jugado: false },
                { fecha: "Dom 17 Mayo - 14:30 hrs", equipoA: "Universidad Católica", equipoB: "Colo Colo", jugado: false },
                { fecha: "Dom 17 Mayo - 15:45 hrs", equipoA: "Boston College", equipoB: "Stadio Italiano", jugado: false },

                // FASE FINAL (No suman puntos, tienen la etiqueta esPlayoff: true)
                { fecha: "Dom 17 Mayo - 17:00 hrs", equipoA: "3° Lugar Damas", equipoB: "4° Lugar Damas", jugado: false, esPlayoff: true, etiqueta: "Tercer Lugar" },
                { fecha: "Dom 17 Mayo - 18:30 hrs", equipoA: "1° Lugar Damas", equipoB: "2° Lugar Damas", jugado: false, esPlayoff: true, etiqueta: "GRAN FINAL" }
            ]
        };

        // =====================================================================
        // LÓGICA DE CÁLCULO Y RENDERIZADO
        // =====================================================================

        function calcularYMostrar() {
            ['masculino', 'femenino'].forEach(cat => {
                let nombresEquipos = cat === 'masculino' ? equiposMasculino : equiposFemenino;
                let partidos = partidosJugados[cat];
                
                let stats = nombresEquipos.map(nombre => ({
                    nombre: nombre, pje: 0, ptdos: 0, gndos: 0, set_plus: 0, set_minus: 0, ptos_plus: 0, ptos_minus: 0
                }));

                // Calcular puntos SOLO de los partidos que NO son playoff (esPlayoff: false o undefined)
                partidos.forEach(p => {
                    if (p.jugado && !p.esPlayoff) {
                        let eqA = stats.find(e => e.nombre === p.equipoA);
                        let eqB = stats.find(e => e.nombre === p.equipoB);

                        if(eqA && eqB) {
                            eqA.ptdos++; eqB.ptdos++;
                            eqA.set_plus += p.setsA; eqA.set_minus += p.setsB;
                            eqB.set_plus += p.setsB; eqB.set_minus += p.setsA;
                            eqA.ptos_plus += p.ptosA; eqA.ptos_minus += p.ptosB;
                            eqB.ptos_plus += p.ptosB; eqB.ptos_minus += p.ptosA;

                            let difSets = Math.abs(p.setsA - p.setsB);
                            if (p.setsA > p.setsB) {
                                eqA.gndos++;
                                if (difSets >= 2) { eqA.pje += 3; } else { eqA.pje += 2; eqB.pje += 1; }
                            } else if (p.setsB > p.setsA) {
                                eqB.gndos++;
                                if (difSets >= 2) { eqB.pje += 3; } else { eqB.pje += 2; eqA.pje += 1; }
                            }
                        }
                    }
                });

                // Ordenar tabla de posiciones
                stats.sort((a, b) => {
                    if (b.pje !== a.pje) return b.pje - a.pje;
                    let aSetAvg = a.set_minus === 0 ? a.set_plus : a.set_plus / a.set_minus;
                    let bSetAvg = b.set_minus === 0 ? b.set_plus : b.set_plus / b.set_minus;
                    if (bSetAvg !== aSetAvg) return bSetAvg - aSetAvg;
                    let aPtosAvg = a.ptos_minus === 0 ? a.ptos_plus : a.ptos_plus / a.ptos_minus;
                    let bPtosAvg = b.ptos_minus === 0 ? b.ptos_plus : b.ptos_plus / b.ptos_minus;
                    return bPtosAvg - aPtosAvg;
                });

                // Inyectar HTML en la Tabla
                let tbody = document.querySelector(`#tabla-${cat} tbody`);
                tbody.innerHTML = '';
                stats.forEach(eq => {
                    let difset = eq.set_plus - eq.set_minus;
                    let claseBadge = difset > 0 ? 'positivo' : (difset < 0 ? 'negativo' : 'neutro');
                    let formatoDifset = `<span class="badge ${claseBadge}">${difset > 0 ? '+'+difset : difset}</span>`;
                    
                    let setavg = eq.set_minus === 0 ? (eq.set_plus === 0 ? "0.00" : eq.set_plus.toFixed(2)) : (eq.set_plus / eq.set_minus).toFixed(2);
                    let ptosavg = eq.ptos_minus === 0 ? (eq.ptos_plus === 0 ? "0.00" : eq.ptos_plus.toFixed(2)) : (eq.ptos_plus / eq.ptos_minus).toFixed(2);

                    tbody.innerHTML += `
                        <tr>
                            <td class="col-equipo">${eq.nombre}</td>
                            <td>${eq.pje}</td><td>${eq.ptdos}</td><td>${eq.gndos}</td>
                            <td>${eq.set_plus}</td><td>${eq.set_minus}</td><td>${formatoDifset}</td>
                            <td>${eq.ptos_plus}</td><td>${eq.ptos_minus}</td><td>${setavg}</td><td>${ptosavg}</td>
                        </tr>
                    `;
                });

                // Inyectar Fixture/Historial
                let historialDiv = document.getElementById(`historial-${cat}`);
                historialDiv.innerHTML = '';
                
                let mostroPlayoffs = false;

                partidos.forEach(p => {
                    // Si llegamos a los playoffs, agregamos un título separador
                    if (p.esPlayoff && !mostroPlayoffs) {
                        historialDiv.innerHTML += `<div class="separador-fase">Fase Final</div>`;
                        mostroPlayoffs = true;
                    }

                    // Clases CSS extra si es un partido de final
                    let claseCard = p.esPlayoff ? "partido-card playoff" : "partido-card";
                    let htmlEtiqueta = p.esPlayoff ? `<div class="playoff-etiqueta">${p.etiqueta}</div>` : "";
                    
                    if (p.jugado) {
                        historialDiv.innerHTML += `
                            <div class="${claseCard}">
                                ${htmlEtiqueta}
                                <div class="partido-fecha">📅 ${p.fecha}</div>
                                <div class="partido-resultado">
                                    <div class="eq-nombre">${p.equipoA}</div>
                                    <div class="marcador-sets">${p.setsA} - ${p.setsB}</div>
                                    <div class="eq-nombre right">${p.equipoB}</div>
                                </div>
                                <div class="partido-detalles">Puntos: ${p.ptosA} - ${p.ptosB}</div>
                            </div>
                        `;
                    } else {
                        historialDiv.innerHTML += `
                            <div class="${claseCard}" style="opacity: ${p.esPlayoff ? '1' : '0.8'};">
                                ${htmlEtiqueta}
                                <div class="partido-fecha">📅 ${p.fecha}</div>
                                <div class="partido-resultado">
                                    <div class="eq-nombre">${p.equipoA}</div>
                                    <div class="marcador-pendiente">VS</div>
                                    <div class="eq-nombre right">${p.equipoB}</div>
                                </div>
                                <div class="partido-detalles">Por jugar</div>
                            </div>
                        `;
                    }
                });
            });
        }

        calcularYMostrar();
    </script>
</body>
</html>
