<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo de Vóley Súper 4 - Resultados</title>
    <style>
        /* Mismos estilos que antes, pero sin los controles */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #2c3e50; }
        .contenedor { display: flex; flex-direction: column; gap: 30px; max-width: 1200px; margin: 0 auto; }
        .categoria { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .tabla-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { padding: 10px; text-align: center; border: 1px solid #e0e0e0; }
        th { background-color: #4a86b8; color: white; font-weight: normal; text-transform: uppercase; }
        .col-equipo { text-align: left; font-weight: bold; color: #555; }
        .positivo { color: #27ae60; font-weight: bold; }
        .negativo { color: #e74c3c; font-weight: bold; }
        .historial-partidos { margin-top: 20px; padding: 15px; background-color: #fafafa; border-left: 4px solid #4a86b8; }
        .historial-partidos ul { list-style: none; padding: 0; margin: 0; }
        .historial-partidos li { padding: 8px 0; border-bottom: 1px dashed #ccc; color: #555; }
        .fecha-historial { font-size: 0.85em; color: #888; margin-right: 10px; }
    </style>
</head>
<body>

    <h1>Torneo de Vóley Súper 4</h1>

    <div class="contenedor">
        <div class="categoria" id="seccion-masculino">
            <h2>Cuadrangular Masculino</h2>
            <div class="tabla-container">
                <table id="tabla-masculino">
                    <thead>
                        <tr>
                            <th class="col-equipo">EQUIPO</th>
                            <th>PJE</th><th>PTDOS</th><th>GNDOS</th>
                            <th>SET+</th><th>SET-</th><th>DIFSET</th>
                            <th>PTOS+</th><th>PTOS-</th><th>SETAVG</th><th>PTOSAVG</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="historial-partidos">
                <h3>Resultados Oficiales</h3>
                <ul id="historial-masculino"></ul>
            </div>
        </div>

        <div class="categoria" id="seccion-femenino">
            <h2>Cuadrangular Femenino</h2>
            <div class="tabla-container">
                <table id="tabla-femenino">
                    <thead>
                        <tr>
                            <th class="col-equipo">EQUIPO</th>
                            <th>PJE</th><th>PTDOS</th><th>GNDOS</th>
                            <th>SET+</th><th>SET-</th><th>DIFSET</th>
                            <th>PTOS+</th><th>PTOS-</th><th>SETAVG</th><th>PTOSAVG</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="historial-partidos">
                <h3>Resultados Oficiales</h3>
                <ul id="historial-femenino"></ul>
            </div>
        </div>
    </div>

    <script>
        // 1. AQUÍ CONFIGURAS LOS EQUIPOS (Solo los nombres, el resto inicia en 0)
        const equiposMasculino = ["UC Masculino", "UAI", "UCH", "USACH"];
        const equiposFemenino = ["UC Femenino", "Pirque F", "ADV Curico F", "Chicureo F"];

        // 2. TÚ ERES LA BASE DE DATOS: Agrega los partidos aquí a medida que se jueguen.
        // Ejemplo de formato: { fecha: "11-05-2026", equipoA: "CEV Chicureo", setsA: 3, equipoB: "Pirque", setsB: 0, ptosA: 75, ptosB: 60 }
        const partidosJugados = {
            masculino: [
                // ¡Agrega los partidos masculinos debajo de esta línea!
                { fecha: "11-05-2026", equipoA: "UC Masculino", setsA: 3, equipoB: "UCH", setsB: 1, ptosA: 98, ptosB: 85 }
                
            ],
            femenino: [
                 // ¡Agrega los partidos femeninos debajo de esta línea!
                 
            ]
        };

        // =====================================================================
        // DE AQUÍ HACIA ABAJO EL CÓDIGO HACE LA MAGIA, NO NECESITAS TOCARLO
        // =====================================================================

        function calcularYMostrar() {
            ['masculino', 'femenino'].forEach(cat => {
                let nombresEquipos = cat === 'masculino' ? equiposMasculino : equiposFemenino;
                let partidos = partidosJugados[cat];
                
                // Crear estructura base de estadísticas
                let stats = nombresEquipos.map(nombre => ({
                    nombre: nombre, pje: 0, ptdos: 0, gndos: 0, set_plus: 0, set_minus: 0, ptos_plus: 0, ptos_minus: 0
                }));

                // Calcular estadísticas basadas en los partidos jugados
                partidos.forEach(p => {
                    let eqA = stats.find(e => e.nombre === p.equipoA);
                    let eqB = stats.find(e => e.nombre === p.equipoB);

                    if(eqA && eqB) {
                        eqA.ptdos++; eqB.ptdos++;
                        eqA.set_plus += p.setsA; eqA.set_minus += p.setsB;
                        eqB.set_plus += p.setsB; eqB.set_minus += p.setsA;
                        eqA.ptos_plus += p.ptosA; eqA.ptos_minus += p.ptosB;
                        eqB.ptos_plus += p.ptosB; eqB.ptos_minus += p.ptosA;

                        let difSets = Math.abs(p.setsA - p.setsB);
                        if (p.setsA > p.setsB) {
                            eqA.gndos++;
                            if (difSets >= 2) { eqA.pje += 3; } else { eqA.pje += 2; eqB.pje += 1; }
                        } else if (p.setsB > p.setsA) {
                            eqB.gndos++;
                            if (difSets >= 2) { eqB.pje += 3; } else { eqB.pje += 2; eqA.pje += 1; }
                        }
                    }
                });

                // Ordenar tabla
                stats.sort((a, b) => {
                    if (b.pje !== a.pje) return b.pje - a.pje;
                    let aSetAvg = a.set_minus === 0 ? a.set_plus : a.set_plus / a.set_minus;
                    let bSetAvg = b.set_minus === 0 ? b.set_plus : b.set_plus / b.set_minus;
                    if (bSetAvg !== aSetAvg) return bSetAvg - aSetAvg;
                    let aPtosAvg = a.ptos_minus === 0 ? a.ptos_plus : a.ptos_plus / a.ptos_minus;
                    let bPtosAvg = b.ptos_minus === 0 ? b.ptos_plus : b.ptos_plus / b.ptos_minus;
                    return bPtosAvg - aPtosAvg;
                });

                // Dibujar Tabla
                let tbody = document.querySelector(`#tabla-${cat} tbody`);
                tbody.innerHTML = '';
                stats.forEach(eq => {
                    let difset = eq.set_plus - eq.set_minus;
                    let formatoDifset = difset > 0 ? `<span class="positivo">+${difset}</span>` : (difset < 0 ? `<span class="negativo">${difset}</span>` : difset);
                    let setavg = eq.set_minus === 0 ? eq.set_plus : (eq.set_plus / eq.set_minus).toFixed(2);
                    let ptosavg = eq.ptos_minus === 0 ? eq.ptos_plus : (eq.ptos_plus / eq.ptos_minus).toFixed(2);

                    tbody.innerHTML += `
                        <tr>
                            <td class="col-equipo">${eq.nombre}</td>
                            <td>${eq.pje}</td><td>${eq.ptdos}</td><td>${eq.gndos}</td>
                            <td>${eq.set_plus}</td><td>${eq.set_minus}</td><td>${formatoDifset}</td>
                            <td>${eq.ptos_plus}</td><td>${eq.ptos_minus}</td><td>${setavg}</td><td>${ptosavg}</td>
                        </tr>
                    `;
                });

                // Dibujar Historial
                let historialUl = document.getElementById(`historial-${cat}`);
                historialUl.innerHTML = '';
                partidos.forEach(p => {
                    let fechaPartida = p.fecha.split("-").join("/");
                    historialUl.innerHTML += `<li><span class="fecha-historial">[${fechaPartida}]</span> <strong>${p.equipoA}</strong> ${p.setsA} - ${p.setsB} <strong>${p.equipoB}</strong> <small>(Puntos: ${p.ptosA}-${p.ptosB})</small></li>`;
                });
            });
        }

        calcularYMostrar();
    </script>
</body>
</html>
